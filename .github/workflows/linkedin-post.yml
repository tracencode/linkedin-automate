name: LinkedIn post

on:
  schedule:
    # Daily slots in Asia/Kolkata (UTC+5:30): 09:15, 13:15, 18:15.
    # Cron fires at those exact UTC equivalents; the job also gates on local slot time.
    - cron: "45 3 * * *"   # 09:15 Asia/Kolkata
    - cron: "45 7 * * *"   # 13:15 Asia/Kolkata
    - cron: "45 12 * * *"  # 18:15 Asia/Kolkata
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate/select a post but do not publish"
        type: boolean
        default: false
      force:
        description: "Ignore already-posted-today and cadence checks"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish
        env:
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
          OPENAI_IMAGE_MODEL: gpt-image-2.5-flare
          LINKEDIN_POST_API: ugc
          SCHEDULE: daily
          POST_TIMES: "09:15,13:15,18:15"
          POSTS_PER_DAY: "3"
          TIMEZONE: Asia/Kolkata
          AUTO_PUBLISH: "false"
          QUEUE_MIN: "9"
          IMAGE_CHANCE: "1"
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          npm run run -- $FLAGS

      - name: Save queue and history
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Record LinkedIn post run
          file_pattern: content/queue content/history content/history.json content/drafts content/media
